name: Build and test Docker image

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
    paths:
      - Dockerfile
      - test/**
      - .github/workflows/pr-build-check.yml
      - .github/workflows/build-publish.yml

env:
  # set in ref name step
  GITHUB_REF:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Multiplatform build and test
    strategy:
      fail-fast: false
      matrix:
        platform:
          - platform: linux/amd64
            pair: linux-amd64
          - platform: linux/arm64
            pair: linux-arm64
    steps:
      - name: Get safe ref name
        id: safeRefName
        run: |
          ref=${{github.ref}}
          echo "REF=${ref//\//-}" >> "$GITHUB_OUTPUT"

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: false
          load: true
          tags: chisel-nodejs-base:test
          platforms: ${{ matrix.platform.platform }}
          cache-to: type=registry,ref=nvitaterna/buildcache:${{vars.REGISTRY_IMAGE}}-${{ matrix.platform.pair }}-${{steps.safeRefName.outputs.REF}},mode=max
          cache-from: |
            type=registry,ref=nvitaterna/buildcache:${{vars.REGISTRY_IMAGE}}-${{ matrix.platform.pair }}-${{steps.safeRefName.outputs.REF}}
            type=registry,ref=nvitaterna/buildcache:${{vars.REGISTRY_IMAGE}}-${{ matrix.platform.pair }}

      # the base has no shell or node, so run the official node binary on it
      - name: Test
        env:
          PLATFORM: ${{ matrix.platform.platform }}
        run: |
          docker buildx build --platform "$PLATFORM" --output type=local,dest=test-node test/
          docker run --rm --platform "$PLATFORM" \
            -v "$PWD/test-node/node:/usr/bin/node:ro" \
            -v "$PWD/test/check.js:/check.js:ro" \
            chisel-nodejs-base:test /usr/bin/node /check.js
